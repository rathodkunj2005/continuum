[package]
name = "fndr-eg2-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "FNDR's EmbeddingGemma 2 text engine: its own llama.cpp, apart from Qwen's"

# Built on its own (scripts/eg2/build-helper.sh), never as part of the app crate.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bindgen = "0.72"
